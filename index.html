const FB={apiKey:"AIzaSyDLAMSmpoaStEZTu3j4dq8WM2Cpgv7HniY",authDomain:"catalogo-9c98e.firebaseapp.com",projectId:"catalogo-9c98e",storageBucket:"catalogo-9c98e.firebasestorage.app",messagingSenderId:"674226250054",appId:"1:674226250054:web:75f41e5163672419ef8547"};
/* ===== BANCO (Firebase ou modo demo local) ===== */
let fs=null;if(FB.apiKey!=="COLE_AQUI"&&window.firebase){firebase.initializeApp(FB);fs=firebase.firestore()}
const L=()=>JSON.parse(localStorage.getItem('sx')||'{}'),subs=[];
const mp=(o,since)=>Object.entries(o||{}).filter(([i,x])=>!since||x.ts>=since).map(([id,x])=>({id,...x}));
const DB={
async get(p,id){if(fs){const d=await fs.collection(p).doc(id).get();return d.exists?{id,...d.data()}:null}const o=(L()[p]||{})[id];return o?{id,...o}:null},
async set(p,id,d){const x={...d};delete x.id;if(fs)return fs.collection(p).doc(id).set(x);const o=L();(o[p]=o[p]||{})[id]=x;localStorage.setItem('sx',JSON.stringify(o));subs.forEach(f=>f())},
async del(p,id){if(fs)return fs.collection(p).doc(id).delete();const o=L();if(o[p])delete o[p][id];localStorage.setItem('sx',JSON.stringify(o));subs.forEach(f=>f())},
async list(p){if(fs){const s=await fs.collection(p).get();return s.docs.map(d=>({id:d.id,...d.data()}))}return mp(L()[p])},
watch(p,cb,since){if(fs){let q=fs.collection(p);if(since)q=q.where('ts','>=',since);return q.onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))))}
const f=()=>cb(mp(L()[p],since));subs.push(f);f();return()=>subs.splice(subs.indexOf(f),1)}};
/* ===== HELPERS ===== */
const $=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
const uid=()=>Math.random().toString(36).slice(2,8);
const dg=s=>String(s||'').replace(/\D/g,'');
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const base=()=>location.origin+location.pathname;
function toast(m){const t=$('#tt');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
function sh(h){$('#sh').innerHTML=h;$('#ov').classList.add('on')}function cl(){$('#ov').classList.remove('on')}
function img(f,max,cb,sq){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let sx=0,sy=0,sw=im.width,sh_=im.height;if(sq){const m=Math.min(sw,sh_);sx=(sw-m)/2;sy=(sh_-m)/2;sw=sh_=m}const k=Math.min(1,max/Math.max(sw,sh_)),c=document.createElement('canvas');c.width=sw*k;c.height=sh_*k;c.getContext('2d').drawImage(im,sx,sy,sw,sh_,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.onerror=()=>toast('Imagem inválida');im.src=r.result};r.readAsDataURL(f)}
function theme(pn){const s=document.documentElement.style;if(!E)return;s.setProperty('--p',E.cor||'#7c3a9e');s.setProperty('--f',`'${E.fonte||'Figtree'}',sans-serif`);if(pn)['--bg','--tx','--card','--h'].forEach(k=>s.removeProperty(k));else{s.setProperty('--bg',E.bg||'#faf6f3');s.setProperty('--tx',E.tx||'#2a1a17');s.setProperty('--card',E.card||'#ffffff');s.setProperty('--h',`'${E.fonteT||'Fraunces'}',serif`)}}
function reset(){const s=document.documentElement.style;['--p','--bg','--tx','--f','--card','--h'].forEach(k=>s.removeProperty(k))}
const PI=()=>'empresas/'+E.id+'/itens',PO=()=>'empresas/'+E.id+'/pedidos';
let un=[],E=null,IT=[],OR=[],cart={},tab='res',per='hoje',cdate='';
function clean(){un.forEach(f=>f());un=[]}
const demo=()=>fs?'':'<div class="st">⚠️ Modo demonstração: dados salvos só neste aparelho. Configure o Firebase para valer.</div>';
/* ===== AUTENTICAÇÃO (e-mail e senha) ===== */
let cur=null;
const AUe=c=>({'auth/email-already-in-use':'Este e-mail já está cadastrado.','auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/weak-password':'A senha precisa ter 6 ou mais caracteres.','auth/invalid-email':'E-mail inválido.','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.','auth/network-request-failed':'Sem conexão com a internet.','auth/operation-not-allowed':'Ative o login por e-mail/senha no Firebase.'}[c]||'Erro: '+c);
const AU={ready:null,
init(){if(fs)this.ready=new Promise(r=>firebase.auth().onAuthStateChanged(u=>{cur=u;r()}));else{try{cur=JSON.parse(localStorage.sxs||'null')}catch(e){}this.ready=Promise.resolve()}},
async up(e,p){if(fs){const c=await firebase.auth().createUserWithEmailAndPassword(e,p);cur=c.user;return}const U=JSON.parse(localStorage.sxu||'{}');if(U[e])throw{code:'auth/email-already-in-use'};if(p.length<6)throw{code:'auth/weak-password'};U[e]={p,uid:'u'+uid()+uid()};localStorage.sxu=JSON.stringify(U);cur={email:e,uid:U[e].uid};localStorage.sxs=JSON.stringify(cur)},
async in(e,p){if(fs){const c=await firebase.auth().signInWithEmailAndPassword(e,p);cur=c.user;return}const U=JSON.parse(localStorage.sxu||'{}');if(!U[e]||U[e].p!==p)throw{code:'auth/invalid-credential'};cur={email:e,uid:U[e].uid};localStorage.sxs=JSON.stringify(cur)},
async out(){if(fs)await firebase.auth().signOut();cur=null;localStorage.removeItem('sxs');location.hash='#/';route()},
async reset(e){if(!fs)return toast('Disponível só com o Firebase conectado');await firebase.auth().sendPasswordResetEmail(e);toast('Enviamos o link para '+e)}};
AU.init();
const isCEO=()=>!!cur&&(cur.email||'').toLowerCase()===CEO_EMAIL.toLowerCase();
const RES=['admin','ceo','cadastro','entrar','painel'];
async function myCo(){let l;if(fs){const q=await fs.collection('empresas').where('uid','==',cur.uid).get();l=q.docs.map(d=>({id:d.id,...d.data()}))}else l=mp(L().empresas).filter(x=>x.uid===cur.uid);return l[0]||null}
/* ===== ROTAS: #/ (entrar)  #/cadastro  #/ceo  #/loja  #/loja/painel ===== */
async function route(){clean();cl();reset();E=null;await AU.ready;const[a,b]=location.hash.replace(/^#\/?/,'').split('/');
if(!a||a==='entrar')return home();if(a==='admin'||a==='ceo')return ceo();if(a==='cadastro')return cad();if(b==='painel')return painel(a);return menu(a)}
addEventListener('hashchange',route);
async function home(){if(cur&&!isCEO()){const c=await myCo();if(c){location.hash='#/'+c.id+'/painel';return}}
A.innerHTML=demo()+`<div class=c style="max-width:380px;margin:auto"><h1>🛍️ Cardápio Digital</h1><p>Entre na sua loja ou crie uma conta.</p><div style="text-align:left"><label>E-mail</label><input id=le type=email autocomplete=email><label>Senha</label><input id=lp type=password autocomplete=current-password></div><br><button class=b style="width:100%" onclick=li()>Entrar</button><p><a href="#" onclick="fg();return false">Esqueci minha senha</a></p><hr style="opacity:.2;margin:18px 0"><a class="b o" style="display:block;text-decoration:none" href="#/cadastro">Criar minha loja</a><p style="margin-top:36px;font-size:12px"><a href="#/ceo">Acesso do administrador</a></p></div>`}
async function li(){const e=$('#le').value.trim().toLowerCase(),p=$('#lp').value;if(!e||!p)return toast('Informe e-mail e senha');try{await AU.in(e,p)}catch(x){return toast(AUe(x.code))}route()}

async function cad(){if(cur&&!isCEO()){const c=await myCo();if(c){location.hash='#/'+c.id+'/painel';return}}
A.innerHTML=demo()+`<div class=c style="max-width:380px;margin:auto"><a href="#/" class="b o s" style="text-decoration:none">← Voltar</a><h2 style="margin-top:16px">Criar minha loja</h2><div style="text-align:left"><label>Nome da empresa</label><input id=cn2><label>E-mail</label><input id=ce type=email value="${esc(cur?.email||'')}" ${cur?'readonly':''}><label>WhatsApp para pedidos (DDI+DDD)</label><input id=cw type=tel placeholder=5562999999999>${cur?'':'<label>Crie uma senha (mín. 6)</label><input id=cs type=password>'}</div><br><button class=b style="width:100%" onclick=cc()>Criar minha loja</button><p style="font-size:12px;opacity:.7">Você configura tudo e o cardápio fica público após a liberação.</p></div>`}
async function cc(){const n=$('#cn2').value.trim(),em=$('#ce').value.trim().toLowerCase(),w=dg($('#cw').value),pw=$('#cs')?$('#cs').value:'',id=slug(n);
if(!n||!id||!em||w.length<10)return toast('Preencha nome, e-mail e WhatsApp (com DDD)');if(!cur&&pw.length<6)return toast('A senha precisa ter 6 ou mais caracteres');

try{await DB.set('empresas',id,{nome:n,tag:'Faça seu pedido pelo WhatsApp',wa:w,end:'',hor:'',taxa:0,aberto:true,st:'pendente',uid:cur.uid,cor:'#7c3a9e',bg:'#faf6f3',tx:'#2a1a17',card:'#ffffff',fonte:'Figtree',fonteT:'Fraunces',logo:'',capa:'',fundo:'',cats:[{id:uid(),n:'Produtos'}],criado:Date.now()});await DB.set('empresas/'+id+'/priv','info',{email:cur.email||em})}catch(x){return toast('Erro ao criar a loja: '+(x.code||x.message))}

if(!E||(E.st||'ativa')!=='ativa'){reset();A.innerHTML='<div class=c><h2>Cardápio indisponível</h2></div>';return}

function spy(){const s=[...document.querySelectorAll('.mt')];let a=null;s.forEach(x=>{if(x.getBoundingClientRect().top<150)a=x.id});const ch=[...document.querySelectorAll('.mc a')];ch.forEach((x,i)=>x.classList.toggle('on',a?('c'+x.dataset.c===a):i===0))}

/* --- loja: aparência com salvamento automático --- */
const FT=['Figtree','Poppins','Montserrat','Lora','Baloo 2','Playfair Display','Fraunces'];
const TM=[['Roxo','#7c3a9e','#faf6f3','#2a1a17','#ffffff'],['Caramelo','#a5603f','#fbf7f3','#2f1d14','#ffffff'],['Rosa','#db2777','#fff5f9','#3b0a24','#ffffff'],['Verde','#15803d','#f4faf5','#14291c','#ffffff'],['Azul','#2563eb','#f3f6fb','#0f172a','#ffffff'],['Laranja','#c2410c','#fff8ef','#2b1a10','#ffffff'],['Vermelho','#dc2626','#fef6f6','#450a0a','#ffffff'],['Escuro','#f59e0b','#111827','#f9fafb','#1f2937'],['Preto e ouro','#d4a017','#0a0a0a','#f5f5f5','#1a1a1a']];
function pvh(){const bg=E.capa?`linear-gradient(#0006,#0006),url(${E.capa}) center/cover`:E.cor;return `<div style="border-radius:16px;overflow:hidden;border:1px solid #0002;background:${E.bg};color:${E.tx};font-family:'${E.fonte||'Figtree'}',sans-serif"><div style="background:${bg};color:#fff;padding:16px 16px 38px">${E.logo?`<img src="${E.logo}" style="width:46px;height:46px;border-radius:13px;object-fit:contain;background:#fff;display:block;margin-bottom:8px">`:''}<div style="font-family:'${E.fonteT||'Fraunces'}',serif;font-size:24px;font-weight:700">${esc(E.nome)}</div><div style="opacity:.9;font-size:13px">${esc(E.tag)}</div></div><div style="padding:0 12px 12px"><div style="background:${E.card||'#fff'};border-radius:16px;padding:12px;margin-top:-24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0002"><div><b>Produto exemplo</b><div style="font-size:18px;font-weight:800;margin-top:6px">R$ 19,90</div></div><span style="width:34px;height:34px;border-radius:50%;background:${E.cor};color:#fff;display:grid;place-items:center;font-size:20px">+</span></div></div></div>`}
function pvu(){const e=$('#pvw');if(e)e.innerHTML=pvh()}
function ss2(m){const e=$('#asv');if(e)e.textContent=m}
function ch(){pvu();ss2('Salvando…');clearTimeout(ch.t);ch.t=setTimeout(asv,700)}
async function asv(){E.wa=dg(E.wa);if(!(E.nome||'').trim()||E.wa.length<10){ss2('⚠️ Informe o nome e o WhatsApp (com DDD) para salvar');return}try{await sv();ss2('✔ Salvo automaticamente')}catch(x){ss2('⚠️ Erro ao salvar: '+(x.code||x.message))}}
function tm(i){const t=TM[i];E.cor=t[1];E.bg=t[2];E.tx=t[3];E.card=t[4];dp();ch()}
function vLoja(){const f=(k,l,t='text')=>`<label>${l}</label><input type=${t} value="${esc(E[k])}" oninput="E['${k}']=${t==='number'?'parseFloat(this.value)||0':'this.value'};ch()">`;
const pk=(k,l,mx)=>`<label>${l}</label>${E[k]?`<div><img src="${E[k]}" style="max-width:100%;max-height:110px;border-radius:10px"></div>`:''}<label class="b o s" style="display:inline-block;margin:6px 0">📷 Escolher da galeria<input type=file accept="image/*" hidden onchange="img(this.files[0],${mx},u=>{E['${k}']=u;dp();ch()},0)"></label>${E[k]?` <button class="b s r" onclick="E['${k}']='';dp();ch()">Remover</button>`:''}`;
const fs_=(k,l,d)=>`<label>${l}</label><select onchange="E['${k}']=this.value;ch()">${FT.map(x=>`<option ${x===(E[k]||d)?'selected':''}>${x}</option>`).join('')}</select>`;
return `<div class=card><b>Dados da loja</b>${f('nome','Nome da marca')}${f('tag','Slogan / descrição curta')}${f('wa','WhatsApp para pedidos (DDI+DDD)')}${f('end','Endereço')}${f('hor','Horário de funcionamento')}${f('taxa','Taxa de entrega (R$)','number')}<label><input type=checkbox ${E.aberto!==false?'checked':''} style="width:auto" onchange="E.aberto=this.checked;ch()"> Loja aberta (aceitando pedidos)</label></div>
<div class=card><b>Imagens do cardápio</b>${pk('logo','Logomarca',300)}${pk('capa','Imagem de capa (topo do cardápio)',900)}${pk('fundo','Imagem de fundo (atrás dos produtos)',800)}</div>
<div class=card><b>Tema e cores</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">${TM.map((t,i)=>`<button class="b s o" onclick="tm(${i})"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${t[1]};vertical-align:middle"></span> ${t[0]}</button>`).join('')}</div>
<div class=k><div><label>Cor principal</label><input type=color value="${E.cor||'#7c3a9e'}" oninput="E.cor=this.value;ch()"></div><div><label>Fundo</label><input type=color value="${E.bg||'#faf6f3'}" oninput="E.bg=this.value;ch()"></div><div><label>Texto</label><input type=color value="${E.tx||'#2a1a17'}" oninput="E.tx=this.value;ch()"></div><div><label>Cartões</label><input type=color value="${E.card||'#ffffff'}" oninput="E.card=this.value;ch()"></div></div>
${fs_('fonteT','Fonte do nome e dos títulos','Fraunces')}${fs_('fonte','Fonte dos textos','Figtree')}<label>Pré-visualização</label><div id=pvw>${pvh()}</div></div>
<div class=card><b>Minha conta</b><p style="margin:6px 0">${esc(cur?.email||'')}</p><button class="b s o" onclick="AU.reset(cur.email).catch(x=>toast(AUe(x.code)))">Redefinir senha por e-mail</button> <button class="b s r" onclick="AU.out()">Sair</button></div>
<p id=asv style="text-align:center;font-size:13px;opacity:.8">✔ As alterações são salvas automaticamente</p>`}
/* ===== LINK / QR / APP ===== */
function vDiv(){const u=base()+'#/'+E.id;return `<div class=card style="text-align:center"><b>Link do seu cardápio</b><p style="word-break:break-all">${u}</p><div id=qr style="display:inline-block;padding:10px;background:#fff"></div><br><br><button class="b s" onclick=dq()>⬇️ Baixar QR Code</button> <button class="b s o" onclick="navigator.clipboard.writeText('${u}');toast('Link copiado')">Copiar link</button> <a class="b s g" style="text-decoration:none" target=_blank href="https://wa.me/?text=${encodeURIComponent('Faça seu pedido: '+u)}">Compartilhar</a></div>
<div class=card><b>App no celular / computador</b><p style="font-size:13px;opacity:.75">Instale o painel como app para abrir com um toque.</p><button class=b onclick=inst()>📲 Instalar app</button></div>`}
function qr(){const el=$('#qr');if(el&&window.QRCode){el.innerHTML='';new QRCode(el,{text:base()+'#/'+E.id,width:220,height:220})}}
function dq(){const c=$('#qr canvas');if(!c)return;const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='qrcode-'+E.id+'.png';a.click()}
let ip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e});
function inst(){if(ip){ip.prompt();ip=null;return}sh('<button class=x onclick=cl()>×</button><h3>Instalar app</h3><p><b>Android (Chrome):</b> menu ⋮ → “Instalar app” ou “Adicionar à tela inicial”.</p><p><b>iPhone (Safari):</b> botão Compartilhar → “Adicionar à Tela de Início”.</p><p><b>Computador (Chrome/Edge):</b> ícone de instalar na barra de endereço.</p>')}
function ico(c,l,z){const k=document.createElement('canvas');k.width=k.height=z;const x=k.getContext('2d');x.fillStyle=c;x.fillRect(0,0,z,z);x.fillStyle='#fff';x.font=`700 ${z*.55}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(l,z/2,z/2+z*.03);return k.toDataURL('image/png')}
function pwa(n,u,c){c=c||'#111827';const l0=(n[0]||'C').toUpperCase(),a=ico(c,l0,192),m={name:n,short_name:n.slice(0,12),start_url:u,scope:base(),display:'standalone',background_color:'#ffffff',theme_color:c,icons:[{src:a,sizes:'192x192',type:'image/png'},{src:ico(c,l0,512),sizes:'512x512',type:'image/png'}]};
let l=document.querySelector('link[rel=manifest]');if(!l){l=document.createElement('link');l.rel='manifest';document.head.appendChild(l)}l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
let t=document.querySelector('link[rel=apple-touch-icon]');if(!t){t=document.createElement('link');t.rel='apple-touch-icon';document.head.appendChild(t)}t.href=a}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
/* ===== PAINEL DO ADMINISTRADOR (aba separada: #/ceo) ===== */
let ML=[],mf='todas',mq='';const SB={pendente:'⏳ pendente',ativa:'✅ ativa',bloqueada:'⛔ bloqueada'};
function ceo(){if(!isCEO()){A.innerHTML=demo()+`<div class=c style="max-width:380px;margin:auto"><a href="#/" class="b o s" style="text-decoration:none">← Voltar ao sistema</a><h2 style="margin-top:20px">Administrador</h2>${cur?`<p>Você está logado como ${esc(cur.email)}, sem permissão de administrador.</p><button class="b s" onclick="AU.out()">Sair</button>`:`<div style="text-align:left"><label>E-mail</label><input id=le type=email><label>Senha</label><input id=lp type=password></div><br><button class=b style="width:100%" onclick=lc()>Entrar</button><p style="font-size:12px"><a href="#" onclick="cc2();return false">Primeiro acesso? Criar conta do administrador</a></p>`}</div>`;return}
un.push(DB.watch('empresas',x=>{ML=x.sort((a,b)=>(b.criado||0)-(a.criado||0));mr()}))}
async function lc(){const e=$('#le').value.trim().toLowerCase(),p=$('#lp').value;if(!e||!p)return toast('Informe e-mail e senha');try{await AU.in(e,p)}catch(x){return toast(AUe(x.code))}route()}
async function cc2(){const e=$('#le').value.trim().toLowerCase(),p=$('#lp').value;if(e!==CEO_EMAIL.toLowerCase())return toast('Use o e-mail do administrador');try{await AU.up(e,p)}catch(x){return toast(AUe(x.code))}route()}
function mr(){if(!location.hash.includes('ceo')||!isCEO())return;
if(!$('#mlist'))A.innerHTML=demo()+`<div class=hd><h2>Painel do administrador</h2><small><a style="color:#fff" href="#/">← Voltar ao sistema</a> · <a style="color:#fff" href="#" onclick="AU.out();return false">Sair</a></small></div><div class="w pn"><div id=mstats class=k></div><div class=card style="margin-top:10px"><b>Link de cadastro (envie para as empresas)</b><p style="word-break:break-all;margin:6px 0">${base()}#/cadastro</p><button class="b s o" onclick="navigator.clipboard.writeText('${base()}#/cadastro');toast('Copiado')">Copiar</button></div><input placeholder="🔎 Buscar empresa" oninput="mq=this.value;mr()"><div id=mfil style="padding:8px 0"></div><div id=mlist class=g2></div></div>`;
const S=e=>e.st||'ativa',n=k=>ML.filter(e=>S(e)===k).length,dt=t=>new Date(t).toLocaleDateString('pt-BR');
$('#mstats').innerHTML=`<div class=card><small>Empresas</small><b>${ML.length}</b></div><div class=card><small>Ativas</small><b>${n('ativa')}</b></div><div class=card><small>Pendentes</small><b>${n('pendente')}</b></div><div class=card><small>Receita (liberadas)</small><b>${R(n('ativa')*PRECO)}</b></div>`;
$('#mfil').innerHTML=['todas','pendente','ativa','bloqueada'].map(k=>`<button class="b s ${mf===k?'':'o'}" onclick="mf='${k}';mr()">${k}</button>`).join(' ');
const q=mq.toLowerCase(),l=ML.filter(e=>(mf==='todas'||S(e)===mf)&&(!q||(e.nome||'').toLowerCase().includes(q)));
$('#mlist').innerHTML=l.map(e=>{const s=S(e);return `<div class=card><div class=row><b>${esc(e.nome)}</b><span class=tg>${SB[s]}</span></div><small>📞 ${esc(e.wa)}<br>Cadastro: ${e.criado?dt(e.criado):'—'}${e.pagoEm?' · Liberada: '+dt(e.pagoEm):''}<br>${base()}#/${e.id}</small>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="b s o" onclick="cp('${e.id}')">Copiar link</button><a class="b s o" style="text-decoration:none" href="#/${e.id}/painel">Abrir painel</a><button class="b s o" onclick="mre('${e.id}')">Redefinir senha</button>${s==='ativa'?`<button class="b s" onclick="mt('${e.id}','bloqueada')">Bloquear</button>`:`<button class="b s g" onclick="mt('${e.id}','ativa')">Liberar</button>`}<button class="b s r" onclick="md('${e.id}')">🗑</button></div></div>`}).join('')||'<p>Nenhuma empresa.</p>'}
function cp(id){navigator.clipboard.writeText(base()+'#/'+id);toast('Link copiado')}
async function mre(id){const i=await DB.get('empresas/'+id+'/priv','info');if(!i)return toast('E-mail não encontrado');try{await AU.reset(i.email)}catch(x){toast(AUe(x.code))}}
async function mt(id,st){const e=await DB.get('empresas',id);e.st=st;if(st==='ativa'&&!e.pagoEm)e.pagoEm=Date.now();await DB.set('empresas',id,e)}
async function md(id){if(!confirm('Excluir esta loja e todos os dados (produtos e pedidos)? Não dá para desfazer.'))return;for(const sub of ['itens','pedidos','priv']){const l=await DB.list('empresas/'+id+'/'+sub);for(const d of l)await DB.del('empresas/'+id+'/'+sub,d.id)}await DB.del('empresas',id);toast('Loja excluída')}
route();
</script></body></html>
